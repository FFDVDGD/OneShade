plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.opd2413.ctrlcenter'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.opd2413.ctrlcenter'
        minSdk 36
        targetSdk 36
        versionCode 5
        versionName '0.4.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
