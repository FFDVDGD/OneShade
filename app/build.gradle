plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.ffdvdgd.oneshade'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.ffdvdgd.oneshade'
        minSdk 36
        targetSdk 36
        versionCode 6
        versionName '0.5.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
}
